kind = "mobile"
previewPath = "/"
title = "RynGet Pay"
description = "RynGet Pay — a mobile payment app for sending money, topping up airtime, managing cards, and tracking transactions. Built with Expo Router."
version = "1.0.0"
id = "artifacts/rynpay"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19792

[services.development]
run = "pnpm --filter @workspace/rynpay run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rynpay", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/rynpay", "run", "serve" ]

[services.env]
PORT = "19792"
BASE_PATH = "/"
